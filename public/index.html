<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#131314" media="(prefers-color-scheme: dark)" />
  <title>Todos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="top-bar">
    <span class="brand">Todos</span>
    <a class="top-link" href="https://github.com/excalapp/todo-app">Source</a>
  </header>
  <div class="color-bar" aria-hidden="true"><span></span><span></span><span></span><span></span></div>

  <main class="app">
    <header class="hero">
      <h1>Todos</h1>
      <p class="tagline">Organize your day, one task at a time.</p>
    </header>

    <form id="new-todo-form" class="new">
      <input id="toggle-all" class="check" type="checkbox" aria-label="Mark all as complete" hidden />
      <input id="new-todo" placeholder="Add a task" autocomplete="off" autofocus aria-label="New todo" />
      <button type="submit" class="add">Add</button>
    </form>

    <section class="card">
      <ul id="todo-list" class="list"></ul>
      <footer id="footer" class="footer" hidden>
        <span id="count" class="count"></span>
        <nav class="filters" aria-label="Filter todos">
          <a href="#/" data-filter="all">All</a>
          <a href="#/active" data-filter="active">Active</a>
          <a href="#/completed" data-filter="completed">Completed</a>
        </nav>
        <button id="clear-completed" class="clear">Clear completed</button>
      </footer>
    </section>

    <p class="hint">Double-click a task to edit it.</p>
  </main>

  <footer class="site-footer">
    <p>Your tasks are stored privately in this browser.</p>
  </footer>

  <script type="module" src="src/app.js"></script>
</body>
</html>
