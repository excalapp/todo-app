<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Todos</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <h1>todos</h1>
    <section class="card">
      <header class="new">
        <input id="toggle-all" type="checkbox" aria-label="Mark all as complete" hidden />
        <form id="new-todo-form">
          <input id="new-todo" placeholder="What needs to be done?" autocomplete="off" autofocus aria-label="New todo" />
        </form>
      </header>
      <ul id="todo-list" class="list"></ul>
      <footer id="footer" class="footer" hidden>
        <span id="count"></span>
        <nav class="filters">
          <a href="#/" data-filter="all">All</a>
          <a href="#/active" data-filter="active">Active</a>
          <a href="#/completed" data-filter="completed">Completed</a>
        </nav>
        <button id="clear-completed" class="clear">Clear completed</button>
      </footer>
    </section>
    <p class="hint">Double-click a todo to edit it.</p>
  </main>
  <script type="module" src="src/app.js"></script>
</body>
</html>
